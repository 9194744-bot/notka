<!DOCTYPE html>
<html>
  <head>
    <title>Orzu Candy's - Tez kunda!</title>
    <style>
      /* Add some styling to the page */
      body {
        background-color: #f1f1f1;
        text-align: center;
        font-family: Arial, sans-serif;
      }
      h1 {
        font-size: 3em;
        margin-top: 50px;
      }
      p {
        font-size: 1.5em;
        margin-bottom: 50px;
      }
      form {
        margin-bottom: 50px;
      }
      input[type="email"] {
        padding: 12px 20px;
        margin: 8px 0;
        box-sizing: border-box;
        border: 2px solid #ccc;
        border-radius: 4px;
      }
      input[type="submit"] {
        background-color: #4CAF50;
        color: white;
        padding: 14px 20px;
        margin: 8px 0;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="logo.jpg" alt="Logo" height="150" width="250">
    <h1>Orzu Candy's</h1>
    <p>Biz hozir sizga ajoyib tajribani taqdim etish uchun qattiq ishlamoqdamiz. <br> Sabr-toqatingiz uchun rahmat.</p>
    <form action="/subscribe.php" method="post">
      <label for="email">Subscribe to our mailing list:</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>
      <input type="submit" value="Subscribe" name="submitButton">
    </form>
    <div id="countdown"></div>
    <script>
      // Add a countdown timer to the page
      var countDownDate = new Date("Feb 1, 2023 00:00:00").getTime();
      var x = setInterval(function() {
        var now = new Date().getTime();
        var distance = countDownDate - now;
        var days = Math.floor(distance / (1000 * 60 * 60 * 24));
        var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        var seconds = Math.floor((distance % (1000 * 60)) / 1000);
        document.getElementById("countdown").innerHTML = days + "kun " + hours + "soat " + minutes + "daq. " + seconds + "son. ";
        if (distance < 0) {
          clearInterval(x);
          document.getElementById("countdown").innerHTML = "EXPIRED";
        }
      }, 1000);
    </script>
  </body>
</html>
